services:
  consul:
    image: hashicorp/consul:1.19
    ports:
      - "8500:8500"
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql   
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # mongo: 
  #   image: mongo:7.0
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongo_data:/data/db
      
  configserver:
    build: ./configserver
    depends_on:
        consul:
          condition: service_healthy
    ports:
      - "8888:8888"
    environment:
      GITHUB_USERNAME: ${GITHUB_USERNAME}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  user:
    build: ./user
    depends_on:
      consul:
        condition: service_healthy
      mysql:
        condition: service_healthy
      configserver:
         condition: service_healthy
    ports:
      - "8020:8020"
    environment:
      SERVER_PORT: 8020
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/user_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CONFIG_IMPORT: optional:configserver:http://configserver:8888
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: dev
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
      APP_BOOTSTRAP_SUPER_MANAGER_PASSWORD: ${MANAGER_PRINCIPAL_BOOTSTRAP_PASSWORD}
      APP_BOOTSTRAP_USER_PASSWORD: ${USER_BOOTSTRAP_PASSWORD}
      
      
