<div class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="card shadow-lg" style="max-width: 420px; width: 100%">
    <div class="card-body p-5 position-relative">
      <button
        class="btn btn-outline-secondary position-absolute top-0 end-0 m-3"
        (click)="toggleTheme()"
        title="Changer le thème"
      >
        <i
          class="bi"
          [class.bi-sun-fill]="!themeService.isDark()"
          [class.bi-moon-fill]="themeService.isDark()"
        >
        </i>
      </button>
      <!--     // bouton pour le theme black       -->

      <div class="text-center mb-5">
        <h2 class="fw-bold text-primary mb-1">Vet&Co</h2>
        <p class="text-muted">Log in to your account</p>
      </div>

      <form (ngSubmit)="onLogin()">
        <div class="mb-4">
          <label class="form-label">&#64;Email</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-envelope"></i>
            </span>
            <input
              type="email"
              class="form-control form-control-lg"
              [(ngModel)]="email"
              name="email"
              required
              placeholder="Enter the email"
            />
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-lock"></i>
            </span>
            <input
              type="password"
              class="form-control form-control-lg"
              [(ngModel)]="password"
              name="password"
              required
              placeholder="Enter the password"
            />
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 mb-4">
          <i class="bi bi-box-arrow-in-right me-2"></i>
          Log In
        </button>
      </form>
    </div>
  </div>
</div>
